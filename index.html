<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USA Mortgage & Loan Calculator</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .calc-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; border-top: 8px solid #2ecc71; }
        h2 { color: #2c3e50; text-align: center; }
        label { display: block; margin-top: 15px; color: #7f8c8d; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .result { background: #e8f8f5; padding: 15px; margin-top: 20px; border-radius: 5px; text-align: center; }
        .amount { font-size: 28px; font-weight: bold; color: #27ae60; }
        button { width: 100%; background: #27ae60; color: white; border: none; padding: 15px; margin-top: 20px; border-radius: 5px; cursor: pointer; font-size: 18px; }
        button:hover { background: #219150; }
    </style>
</head>
<body>
    <div class="calc-card">
        <h2>Mortgage Calculator</h2>
        <label>Loan Amount ($)</label>
        <input type="number" id="amount" value="250000">
        <label>Interest Rate (%)</label>
        <input type="number" id="rate" value="6.5" step="0.1">
        <label>Loan Term (Years)</label>
        <input type="number" id="years" value="30">
        <button onclick="calculate()">Calculate Monthly Payment</button>
        <div class="result">
            <div>Monthly Payment</div>
            <div id="payment" class="amount">$1,580.17</div>
        </div>
    </div>
    <script>
        function calculate() {
            const p = document.getElementById('amount').value;
            const r = (document.getElementById('rate').value / 100) / 12;
            const n = document.getElementById('years').value * 12;
            const m = p * r * (Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
            document.getElementById('payment').innerText = "$" + m.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
    </script>
</body>
</html>
