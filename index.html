<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE USA Mortgage Calculator 2026 | Official Financial Tool</title>
    <style>
        :root { --primary: #1a73e8; --secondary: #2ecc71; --dark: #2c3e50; }
        body { font-family: 'Inter', 'Segoe UI', sans-serif; background: #f4f7f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; margin-bottom: 20px; max-width: 500px; }
        .header h1 { color: var(--dark); font-size: 24px; margin-bottom: 5px; }
        .header p { color: #5f6368; font-size: 14px; }
        .calc-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 420px; border-top: 10px solid var(--primary); box-sizing: border-box; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--dark); font-size: 14px; }
        input { width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px; box-sizing: border-box; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: var(--primary); outline: none; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; margin-top: 20px; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #1557b0; transform: translateY(-2px); }
        .result-box { background: #f8f9fa; padding: 20px; margin-top: 25px; border-radius: 12px; text-align: center; border: 1px dashed #cbd5e0; }
        .result-label { font-size: 14px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
        .amount { font-size: 32px; font-weight: 800; color: var(--secondary); margin-top: 5px; }
        /* MONEY ZONE - For Ads and Affiliate Links later */
        .money-zone { width: 100%; max-width: 420px; margin-top: 20px; padding: 15px; background: #fff3cd; border-radius: 10px; text-align: center; border: 1px solid #ffeeba; font-size: 13px; color: #856404; }
        .trust-badge { margin-top: 15px; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="header">
        <h1>USA Mortgage Calculator 2026</h1>
        <p>Official tool for home buyers in the United States.</p>
    </div>

    <div class="calc-card">
        <div class="input-group">
            <label>Home Price ($)</label>
            <input type="number" id="amount" value="350000">
        </div>
        <div class="input-group">
            <label>Interest Rate (%)</label>
            <input type="number" id="rate" value="6.8" step="0.1">
        </div>
        <div class="input-group">
            <label>Loan Term (Years)</label>
            <input type="number" id="years" value="30">
        </div>
        
        <button onclick="calculate()">Calculate Monthly Payment</button>

        <div class="result-box">
            <div class="result-label">Estimated Monthly Payment</div>
            <div id="payment" class="amount">$2,281.93</div>
        </div>

        <div class="trust-badge">✔ 100% Secure & Anonymous | 2026 Update</div>
    </div>

    <!-- This is where we will put your $100/day Affiliate Link soon -->
    <div class="money-zone" id="affiliate-area">
        <strong>Special Offer:</strong> Looking for lower 2026 rates? 
        <br>Compare top USA lenders and save up to $200/month.
    </div>

    <script>
        function calculate() {
            const p = parseFloat(document.getElementById('amount').value);
            const r = (parseFloat(document.getElementById('rate').value) / 100) / 12;
            const n = parseFloat(document.getElementById('years').value) * 12;
            
            if (p && r && n) {
                const m = p * r * (Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                document.getElementById('payment').innerText = "$" + m.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            }
        }
    </script>
</body>
</html>
